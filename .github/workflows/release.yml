name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Build Python distribution and notebooks
        run: |
          python -m build
          python scripts/build_milestone1_v03_notebooks.py
          cd notebooks/google_drive
          zip -r Milestone1_v0_3_Google_Drive_Notebooks.zip milestone1_v0_3

      - name: Create checksums
        run: |
          sha256sum dist/* \
            notebooks/google_drive/Milestone1_v0_3_Google_Drive_Notebooks.zip \
            > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            notebooks/google_drive/Milestone1_v0_3_Google_Drive_Notebooks.zip \
            SHA256SUMS \
            --verify-tag \
            --generate-notes
