      - sources/ran_pm/17815388/raw
    cadence_seconds: 900
    labelled: false
    topology: base_station_and_sector
    evidence_level: public_real
    source_url: https://zenodo.org/records/17815388
    licence_status: CC-BY-4.0
    licence_review_required: false
    redistribute_source: false
    output_run_id: ran_pm_v1
