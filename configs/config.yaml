# Simulation assumptions, not fitted operator statistics.
generator:
  seed: 42
  entities: 96
  days: 90
  interval_minutes: 5
  noise_db: 0.08
  sensor_noise_db: 0.04
  correlation_hours: 0.5
  daily_amplitude_db: 0.25
  missing_probability: 0.02
  impact_threshold_dbm: -27.0
  faults_per_entity: 2
  upstream_impact_threshold_dbm: -28.0
  fault_duration_median_hours: 36.0
  onts_per_splitter: 8
  splitters_per_port: 2
  ports_per_olt: 4
features:
  window: 12
  long_window_hours: 6.0
  smoothing_hours: 1.0
  allowance: 0.25
  seasonal: true
# Train / score calibration / validation / final test fractions.
splits: [0.4, 0.55, 0.75, 1.0]
incidents:
  high: 0.99
  low: 0.8
  opening_candidates: [2, 3, 6]
  closing_candidates: [3, 6]
  nuisance_budget_per_1000_days: 5.0
model:
  feature_set: temperature  # Explicit scope; comparisons do not remove features.
output: outputs/optical_v9
