version: 1
selection_partition: development
holdout_default_open: false
workload:
  unit: entity_day
  display_unit: 1000_entity_days
  target_false_incidents_per_1000_entity_days: 10
  false_incidents_per_entity_day: 0.01
  confidence_level: 0.95
  safety_factor: 0.90
  # Effective research gate = 0.01 * 0.90 = 0.009 false incidents per
  # entity-day. Selection uses the 95% Poisson upper confidence bound.
thresholds:
  method: empirical_calibration_block_maxima
  block_seconds: 86400
  candidate_quantiles: [0.99, 0.995, 0.9975, 0.999]
  minimum_expected_tail_blocks: 5
channels:
  rapid_self:
    persistence_seconds: 1800
    extreme_tail_score: 5.0
  multimetric_residual:
    persistence_seconds: 1800
  multimetric_tail_mean:
    persistence_seconds: 1800
  persistent_drift:
    # CUSUM already accumulates sustained evidence; one cadence confirms the
    # threshold crossing without adding a second hour of delay.
    persistence_observations: 1
    cusum_allowance: 0.5
  peer_deviation:
    persistence_seconds: 1800
  group_common_mode:
    persistence_seconds: 1800
  dispersion_change:
    persistence_seconds: 1800
  pca_spe:
    persistence_seconds: 1800
  isolation_forest_base:
    persistence_seconds: 1800
  isolation_forest_temporal:
    persistence_seconds: 1800
  isolation_forest_confirmed:
    persistence_seconds: 1800
  isolation_forest_soft_confirmed:
    # A calibrated fast-path challenger. Causal one-observation confirmation
    # still has to pass the independent case-workload verification.
    persistence_observations: 1
  isolation_forest_entity_calibrated:
    persistence_seconds: 1800
  isolation_forest_contextual:
    persistence_seconds: 1800
recovery:
  duration_seconds: 3600
  threshold_fraction: 0.80
portfolios:
  rapid_only: [rapid_self]
  multimetric: [multimetric_residual]
  coherent_multimetric: [multimetric_tail_mean]
  self_history: [rapid_self, persistent_drift]
  temporal_if: [isolation_forest_temporal]
  confirmed_temporal_if: [isolation_forest_confirmed]
  soft_confirmed_fast_if: [isolation_forest_soft_confirmed]
  entity_calibrated_if: [isolation_forest_entity_calibrated]
  temporal_plus_multimetric: [isolation_forest_temporal, multimetric_residual]
  base_if: [isolation_forest_base]
  temporal_with_group: [isolation_forest_temporal, group_common_mode]
  fast_with_group: [isolation_forest_soft_confirmed, group_common_mode]
diagnostic_portfolios:
  drift_only: [persistent_drift]
  peer_only: [peer_deviation]
  group_only: [group_common_mode]
  self_plus_peer: [rapid_self, persistent_drift, peer_deviation]
  full_topology: [rapid_self, persistent_drift, peer_deviation, group_common_mode]
  dispersion_only: [dispersion_change]
  pca_only: [pca_spe]
  contextual_if: [isolation_forest_contextual]
incidents:
  quiet_period_seconds: 3600
  unrestricted_transitive_chaining: false
evaluation:
  default_decision_horizon_seconds: 172800
  one_to_one_matching: true
  uncertainty_intervals: true
  primary_metrics:
    - event_recall
    - false_incidents_per_entity_day
    - incident_precision
    - median_detection_delay_seconds
    - joint_detection_and_localisation_recall
selection:
  ranking_metric: prompt_event_recall
  fail_closed_when_no_candidate_meets_budget: true
  holdout_must_remain_sealed: true
  eligible_portfolios:
    - rapid_only
    - multimetric
    - coherent_multimetric
    - self_history
    - temporal_if
    - confirmed_temporal_if
    - soft_confirmed_fast_if
    - entity_calibrated_if
    - temporal_plus_multimetric
    - base_if
    - temporal_with_group
    - fast_with_group
  # Thirty development faults is the minimum for attempting a research
  # qualification. The notebook also prints confidence intervals and the
  # number of detections required; this is not enough for an operator SLA.
  minimum_development_faults: 30
  minimum_development_event_recall: 0.20
  # This is a research qualification threshold, not a production SLA. It is
  # applied to the 95% Wilson lower bound, not the observed recall.
  # Localisation is reported only when at least 20 genuinely multi-entity
  # faults exist; fewer cases are shown descriptively without a PASS claim.
  minimum_multi_entity_faults_for_localisation_claim: 20
  # More than 20% missing scores means the workload denominator and recall
  # evidence do not describe enough of the intended monitored population.
  maximum_missing_score_fraction: 0.20
