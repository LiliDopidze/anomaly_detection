version: 1
memberships:
  olt_id:
    scope_type: olt
    hierarchy_level: 0
    family: physical_topology
  pon_port:
    scope_type: pon_port
    hierarchy_level: 1
    family: physical_topology
  splitter_l1:
    scope_type: splitter_l1
    hierarchy_level: 2
    family: physical_topology
  splitter_l2:
    scope_type: splitter_l2
    hierarchy_level: 3
    family: physical_topology
  geo_cluster:
    scope_type: geo_cluster
    hierarchy_level: null
    family: geographic_context
peer_policy:
  # Peer order is derived from memberships.hierarchy_level, deepest first.
  # Keeping a second hand-written order here previously allowed it to drift.
  minimum_valid_peers: 7
  minimum_entity_coverage: 0.80
  # Only like-for-like physical measurements enter peer scoring. Traffic,
  # counters and reboot state remain useful incident context, but comparing
  # them across customers creates nuisance alerts without exposure control.
  metric_ids:
    - optical.rx_power
    - optical.olt_rx_power
    - optical.tx_power
    - equipment.temperature
    - optical.bias_current
    - equipment.voltage
group_policy:
  minimum_entities: 3
  minimum_available_fraction: 0.50
  # Common-mode breadth is compared with the early-calibration null within
  # topology-size bands. This is safer than a fixed 25% rule when group sizes
  # and within-group correlation differ between operators.
  affected_fraction_quantile: 0.99
