# Paths are relative to this repository, shared by CLI and all notebooks.
generator: configs/synthetic.yml
adapter: configs/adapter.yml
experiment: configs/synthetic_experiment.yml
pack: data/pon_pipeline
truth: evaluation/pon_pipeline
run: outputs/pon_pipeline
timezone: UTC
channels: [robust, drift, peer, common_mode, silence, margin, isolation_forest, rules]
cusum_allowance: 0.5
minimum_group_size: 3
rest_collector_reporting: 0.8
margin_warning_db: 1.0
static_rx_limit_abs_dbm: 27.0
quiet_minutes: 60
power_window_minutes: 60
power_share: 0.5
scope_hit_probability: 0.85
scope_background_probability: 0.01
# Probabilities above are uncalibrated modelling assumptions, not confidence claims.
maximum_development_attempts: 3
