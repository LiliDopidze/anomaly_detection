[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-agnostic-telemetry"
version = "0.3.1"
description = "Sector-agnostic telemetry contracts, sector packs, source adapters and truth-isolation tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "scipy>=1.10"]
keywords = ["anomaly-detection", "telemetry", "time-series", "data-contracts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "nbformat>=5.10",
  "pytest>=8",
  "twine>=5",
]

[project.scripts]
telemetry-adapt = "anomaly_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anomaly_detection" = [
  "data/schemas/spec_core/*.json",
  "data/schemas/spec_eval/*.json",
  "data/packs/telecom/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
