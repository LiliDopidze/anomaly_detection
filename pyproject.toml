[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-anomaly-blueprint"
version = "0.1.0"
description = "Explicit data contracts and exploratory time-series assessment"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "jupyter-client>=8.6",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ts_anomaly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
