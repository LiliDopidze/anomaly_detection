[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-agnostic-telemetry"
version = "0.3.0"
description = "Sector-agnostic telemetry contracts, sector packs, source adapters and truth-isolation tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "scipy>=1.10"]
keywords = ["anomaly-detection", "telemetry", "time-series", "data-contracts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "nbformat>=5.10",
  "pytest>=8",
  "twine>=5",
]

[project.scripts]
telemetry-adapt = "telemetry_adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"telemetry_contract" = ["schemas/spec-core/*.json"]
"telemetry_eval_contract" = ["schemas/spec-eval/*.json"]
"telemetry_packs.telecom" = ["*.json"]
"telemetry_packs.oil_well" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
