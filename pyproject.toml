[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-anomaly-detection"
version = "5.0.0"
description = "Synthetic PON data generation, validation and anomaly detection baselines"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0", "nbclient>=0.10", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["telco_anomaly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
