[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-anomaly-detector"
version = "9.0.0"
description = "Causal optical-degradation detection and event-level evaluation"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
explain = ["shap>=0.46"]
dev = ["jupyter>=1.0", "nbclient>=0.10", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["optical_anomaly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
